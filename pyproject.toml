[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mineral-process-intelligence"
version = "0.2.1"
description = "Local-first applied research platform for mineral processing intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Yuri Fernando"}]
dependencies = [
  "fastapi>=0.115",
  "joblib>=1.4",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "plotly>=5.24",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "streamlit>=1.40",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["mypy>=1.13", "nbclient>=0.10", "nbformat>=5.10", "pytest>=8.3", "ruff>=0.8"]
mlops = ["mlflow>=2.18", "optuna>=4.1"]

[project.scripts]
mpi = "mineral_process.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mineral_process"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["mineral_process"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
