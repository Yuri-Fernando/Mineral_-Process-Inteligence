services:
  api:
    build: .
    ports:
      - "8000:8000"
  dashboard:
    build: .
    command: ["streamlit", "run", "dashboards/app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./dashboards:/app/dashboards:ro
      - ./reports:/app/reports
      - ./models:/app/models
